name: Cinema City IMAX Monitor

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Register current screenings without sending notifications"
        required: true
        default: false
        type: boolean

# GitHub's own `schedule:` trigger has been removed on purpose -- an
# external cron-job.org job now triggers this workflow via workflow_dispatch
# on a precise schedule instead. Keeping only one trigger source avoids
# redundant duplicate runs piling up in the concurrency queue.

permissions:
  contents: write

# Prevents two runs from overlapping. Without this, if a run ever takes
# longer than 15 minutes (slow API, retries), the next scheduled run could
# start before the previous one finishes and pushes its state -- the second
# run's "git push" would then fail on a non-fast-forward error, and its
# state update would be lost, risking duplicate notifications next time.
#
# queue: max is essential here: without it, GitHub only allows ONE run to
# be queued/waiting at a time per group. If a new trigger arrives while an
# earlier one is still waiting for a free runner (not yet started), GitHub
# cancels the older waiting run outright ("higher priority waiting request
# exists") instead of queuing it -- and if triggers keep arriving faster
# than runners pick jobs up, every run can get cancelled before it ever
# starts. queue: max instead lets up to 100 triggered runs wait in line and
# run one after another in order, so none of them get dropped.
concurrency:
  group: cinema-city-monitor
  cancel-in-progress: false
  queue: max

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Cinema City monitor
        env:
          NOTIFY_DEVICE_ID: ${{ secrets.NOTIFY_DEVICE_ID }}
          NOTIFY_DEVICE_TOKEN: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          SEED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.seed && '1' || '0' }}
        run: |
          python watch.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/seen.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update Cinema City monitor state"
          git push
