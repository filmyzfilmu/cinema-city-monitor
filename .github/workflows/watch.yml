name: Cinema City IMAX Monitor

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Register current screenings without sending notifications"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Cinema City monitor
        env:
          NOTIFY_DEVICE_ID: ${{ secrets.NOTIFY_DEVICE_ID }}
          NOTIFY_DEVICE_TOKEN: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          SEED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.seed && '1' || '0' }}
        run: |
          python watch.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/seen.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update Cinema City monitor state"
          git push
