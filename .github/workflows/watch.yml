name: Cinema City IMAX Monitor

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Register current screenings without sending notifications"
        required: true
        default: false
        type: boolean

# GitHub's own `schedule:` trigger has been removed on purpose -- an
# external cron-job.org job now triggers this workflow via workflow_dispatch
# on a precise schedule instead. Keeping only one trigger source avoids
# redundant duplicate runs piling up in the concurrency queue.

permissions:
  contents: write

# Only one run at a time, and the NEWEST run always wins.
#
# Every run does the same complete check, so an older run that is still
# waiting or still going when a new trigger arrives is worthless -- the new
# run will do its job anyway. cancel-in-progress: true cancels that older
# run (whether it is running, waiting for a runner, or stuck) and lets the
# new one go ahead.
#
# History: this used to be "cancel-in-progress: false" + "queue: max".
# On 17-18 Oct 2026 a single run got stuck for ~16 hours. Every trigger
# after it lined up behind it, the queue filled up at its 100-run limit,
# and every further trigger failed instantly with "Queue is full for
# concurrency group". With the settings below, a stuck run is simply
# cancelled by the next trigger, so the monitor heals itself within one
# trigger interval instead of going dark for hours.
concurrency:
  group: cinema-city-monitor
  cancel-in-progress: true

jobs:
  watch:
    # Pinned instead of ubuntu-latest: GitHub starts moving ubuntu-latest to
    # Ubuntu 26 on 19 Oct 2026. Pinning avoids surprise breakage from that.
    runs-on: ubuntu-24.04

    # A normal run takes well under a minute. If a run is still going after
    # 10 minutes, something is hanging -- kill it rather than let it sit.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Fails (red) if watch.py finds a problem: Cinema City unreachable,
      # its data format changed, IMAX hall not found, notifications failing.
      # The reason is shown at the top of the run's page on GitHub.
      - name: Run Cinema City monitor
        id: monitor
        env:
          NOTIFY_DEVICE_ID: ${{ secrets.NOTIFY_DEVICE_ID }}
          NOTIFY_DEVICE_TOKEN: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          SEED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.seed && '1' || '0' }}
        run: |
          python watch.py

      # Runs even when the monitor step above failed, so notifications that
      # WERE sent before the problem are still recorded and never repeated.
      # (Skipped only if the run was cancelled or the monitor never started.)
      - name: Save state
        if: ${{ !cancelled() && steps.monitor.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/seen.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update Cinema City monitor state"
          git push

      # Heartbeat: tells healthchecks.io "the monitor is alive and healthy".
      # This step only runs when EVERY step above succeeded. If runs keep
      # failing -- or stop happening at all (stuck queue, expired token,
      # cron-job.org down) -- the pings stop, and healthchecks.io emails you.
      - name: Send heartbeat to healthchecks.io
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret is not set -- skipping heartbeat."
            exit 0
          fi

          # If healthchecks.io itself is briefly down, don't fail the run.
          curl -fsS -m 10 --retry 5 -o /dev/null "$HEALTHCHECK_URL" \
            && echo "Heartbeat sent." \
            || echo "::warning::Could not reach healthchecks.io for the heartbeat."
